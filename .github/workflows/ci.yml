name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out xcrawl
        uses: actions/checkout@v4
        with:
          path: xcrawl
      - name: Check out readabilities-rs
        uses: actions/checkout@v4
        with:
          repository: junix/readabilities-rs
          path: readabilities/readabilities-rs
      - name: Install declared MSRV
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - name: Verify
        working-directory: xcrawl
        run: |
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 clippy --locked --all-targets -- -D warnings
          cargo +1.85.0 test --locked --all-targets
          cargo +1.85.0 build --locked
