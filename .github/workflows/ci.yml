name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out xcrawl
        uses: actions/checkout@v4
        with:
          path: xcrawl
      - name: Check out readabilities-rs
        uses: actions/checkout@v4
        with:
          repository: junix/readabilities-rs
          path: readabilities/readabilities-rs
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check minimum supported Rust
        working-directory: xcrawl
        run: cargo +1.88.0 check --locked --all-targets
      - name: Verify
        working-directory: xcrawl
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --locked --all-targets -- -D warnings
          cargo +stable test --locked --all-targets
          cargo +stable build --locked
