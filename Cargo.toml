[package]
name = "xcrawl"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Bounded native web crawler using readabilities-rs for page understanding"
repository = "https://github.com/junix/xcrawl"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.6.0", features = ["derive"] }
futures-util = "0.3.31"
httpdate = "1.0.3"
ipnet = "2.11.0"
readabilities-rs = { path = "../readabilities/readabilities-rs", default-features = false, features = ["charset"] }
reqwest = { version = "0.13.4", default-features = false, features = ["brotli", "deflate", "gzip", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
proptest = "1.9.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
